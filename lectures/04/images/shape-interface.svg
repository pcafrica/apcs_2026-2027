<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Partial implementation and concrete shapes</title><desc id="desc">Shape has pure virtual area and draw. Polygon implements draw and remains abstract. Square and Triangle implement area and become concrete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4949c9"/></marker></defs><rect width="1100" height="480" rx="18" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172033"><rect x="385" y="10" width="330" height="85" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="550.0" y="42" text-anchor="middle" font-weight="bold">Shape: abstract</text><text x="550.0" y="74" text-anchor="middle" font-size="20">area() = 0; draw() = 0</text><rect x="385" y="155" width="330" height="85" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="550.0" y="187" text-anchor="middle" font-weight="bold">Polygon: abstract</text><text x="550.0" y="219" text-anchor="middle" font-size="20">draw() implemented</text><path d="M550,155 L550,95" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="65" y="320" width="350" height="85" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="240.0" y="352" text-anchor="middle" font-weight="bold">Square: concrete</text><text x="240.0" y="384" text-anchor="middle" font-size="20">area() implemented</text><rect x="685" y="320" width="350" height="85" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="860.0" y="352" text-anchor="middle" font-weight="bold">Triangle: concrete</text><text x="860.0" y="384" text-anchor="middle" font-size="20">area() implemented</text><path d="M240,320 L450,240" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M860,320 L650,240" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="550" y="455" text-anchor="middle" font-size="22">Both inherit Polygon::draw; both supply their own area().</text></g></svg>