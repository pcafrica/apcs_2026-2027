<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Reference versus value</title><desc id="desc">A reference aliases the original Dog. Copying into Animal creates a separate Animal object. The original Dog remains unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4949c9"/></marker></defs><rect width="1100" height="430" rx="18" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172033"><rect x="390" y="30" width="320" height="160" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="550.0" y="62" text-anchor="middle" font-weight="bold">Original Dog</text><text x="550.0" y="94" text-anchor="middle" font-size="20">Animal base + Dog part</text><rect x="30" y="260" width="390" height="95" rx="14" fill="#def7ec" stroke="#334155" stroke-width="2"/><text x="225.0" y="292" text-anchor="middle" font-weight="bold">Reference parameter</text><text x="225.0" y="324" text-anchor="middle" font-size="20">refers to the original Dog</text><rect x="680" y="260" width="390" height="95" rx="14" fill="#fff0dc" stroke="#334155" stroke-width="2"/><text x="875.0" y="292" text-anchor="middle" font-weight="bold">Animal value parameter</text><text x="875.0" y="324" text-anchor="middle" font-size="20">new Animal object only</text><path d="M390,140 L225,260" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="226.7" y="169.0" width="161.6" height="25" rx="5" fill="white"/><text x="307.5" y="188.0" text-anchor="middle" font-size="18">bind reference</text><path d="M710,140 L875,260" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="685.7" y="169.0" width="213.6" height="25" rx="5" fill="white"/><text x="792.5" y="188.0" text-anchor="middle" font-size="18">copy base subobject</text><text x="550" y="400" text-anchor="middle" font-size="21">Reference: Woof     |     Value: Animal sound     |     Original Dog: Woof</text></g></svg>