<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Four relationships between objects</title><desc id="desc">Association relates Student and Course. Aggregation is a whole-part association: Car borrows Engine. Composition: Apartment owns Room. Inheritance: Dog is an Animal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4949c9"/></marker></defs><rect width="1100" height="410" rx="18" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172033"><rect x="20" y="55" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="140.0" y="87" text-anchor="middle" font-weight="bold">Student</text><rect x="20" y="260" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="140.0" y="292" text-anchor="middle" font-weight="bold">Course</text><path d="M140,135 L140,260" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="74.8" y="166.5" width="130.4" height="25" rx="5" fill="white"/><text x="140.0" y="185.5" text-anchor="middle" font-size="18">association</text><rect x="290" y="55" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="410.0" y="87" text-anchor="middle" font-weight="bold">Car</text><rect x="290" y="260" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="410.0" y="292" text-anchor="middle" font-weight="bold">Engine</text><path d="M410,135 L410,260" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="298.0" y="166.5" width="224.0" height="25" rx="5" fill="white"/><text x="410.0" y="185.5" text-anchor="middle" font-size="18">aggregation: borrows</text><rect x="560" y="55" width="250" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="685.0" y="87" text-anchor="middle" font-weight="bold">Apartment</text><rect x="560" y="260" width="250" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="685.0" y="292" text-anchor="middle" font-weight="bold">Room</text><path d="M685,135 L685,260" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="588.6" y="166.5" width="192.8" height="25" rx="5" fill="white"/><text x="685.0" y="185.5" text-anchor="middle" font-size="18">composition: owns</text><rect x="840" y="55" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="960.0" y="87" text-anchor="middle" font-weight="bold">Animal</text><rect x="840" y="260" width="240" height="80" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="960.0" y="292" text-anchor="middle" font-weight="bold">Dog</text><path d="M960,260 L960,135" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="863.6" y="166.5" width="192.8" height="25" rx="5" fill="white"/><text x="960.0" y="185.5" text-anchor="middle" font-size="18">inheritance: is-a</text><text x="550" y="395" text-anchor="middle" font-size="21">Aggregation is a special association: a whole refers to an independently managed part.</text></g></svg>