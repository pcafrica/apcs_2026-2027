<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Non-virtual selection versus virtual dispatch</title><desc id="desc">A const Animal reference refers to a Dog object. label is non-virtual and selects Animal label. speak is virtual and selects Dog speak.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4949c9"/></marker></defs><rect width="1100" height="410" rx="18" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172033"><rect x="30" y="55" width="300" height="100" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="180.0" y="87" text-anchor="middle" font-weight="bold">Base reference</text><text x="180.0" y="119" text-anchor="middle" font-size="20">const Animal&amp; animal</text><rect x="425" y="55" width="270" height="100" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="560.0" y="87" text-anchor="middle" font-weight="bold">Dog object</text><text x="560.0" y="119" text-anchor="middle" font-size="20">actual type: Dog</text><path d="M330,105 L425,105" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="65" y="250" width="430" height="100" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="280.0" y="282" text-anchor="middle" font-weight="bold">animal.label()</text><text x="280.0" y="314" text-anchor="middle" font-size="20">non-virtual → Animal::label</text><rect x="605" y="250" width="430" height="100" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="820.0" y="282" text-anchor="middle" font-weight="bold">animal.speak()</text><text x="820.0" y="314" text-anchor="middle" font-size="20">virtual → Dog::speak</text><path d="M180,155 L280,250" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M560,155 L820,250" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="550" y="392" text-anchor="middle" font-size="21">The reference does not copy the object. Virtual dispatch preserves Dog behavior.</text></g></svg>