<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">The diamond problem</title><desc id="desc">Horse and Bird derive from Animal; Pegasus derives from both. Ordinary inheritance gives two Animal bases. Virtual inheritance on both branches shares one initialized by Pegasus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4949c9"/></marker></defs><rect width="1100" height="450" rx="18" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172033"><rect x="420" y="20" width="260" height="75" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="550.0" y="52" text-anchor="middle" font-weight="bold">Animal</text><rect x="160" y="155" width="260" height="75" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="290.0" y="187" text-anchor="middle" font-weight="bold">Horse</text><rect x="680" y="155" width="260" height="75" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="810.0" y="187" text-anchor="middle" font-weight="bold">Bird</text><rect x="420" y="300" width="260" height="75" rx="14" fill="#e8ecff" stroke="#334155" stroke-width="2"/><text x="550.0" y="332" text-anchor="middle" font-weight="bold">Pegasus</text><path d="M290,155 L460,95" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810,155 L640,95" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M460,300 L330,230" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640,300 L770,230" stroke="#4949c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="550" y="425" text-anchor="middle" font-size="21">Ordinary bases: two Animals. Virtual bases on both branches: one shared Animal.</text></g></svg>